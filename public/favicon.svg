<svg xmlns="http://www.w3.org/2000/svg" width="159" height="159" viewBox="0 0 159 159">
  <!-- Mascara con el icono recortado: lo visible es donde la imagen tiene opacidad (mask-type: alpha) -->
  <defs>
    <mask id="icon-mask" maskUnits="userSpaceOnUse" style="mask-type:alpha">
      <image href="data:image/png;base64," width="159" height="159" />
    </mask>
  </defs>
  <!-- Color del favicon: cambia este valor hexadecimal para probar otros colores -->
  <rect width="159" height="159" fill="#D9F2C4" mask="url(#icon-mask)" />
</svg>
